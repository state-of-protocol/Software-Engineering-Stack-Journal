<!DOCTYPE html>
<html lang="ms" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEO OS | Engineering Stack Journal</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="sidebar">
        <div class="sidebar-header">
            <div class="logo">NEO<span>OS</span></div>
            <button id="theme-toggle" class="theme-btn">
                <i data-lucide="moon" id="theme-icon"></i>
            </button>
        </div>

        <div class="nav-group">
            <p class="nav-label">Core Documents</p>
            <a href="#" class="nav-item active" onclick="loadMarkdownFile('NEO_OS.md')">
                <i data-lucide="book-open"></i> Visi Strategik
            </a>
            <a href="#" class="nav-item" onclick="loadMarkdownFile('isi_kandungan.md')">
                <i data-lucide="list"></i> Isi Kandungan
            </a>
            <a href="#" class="nav-item" onclick="loadMarkdownFile('manifesto_awal.md')">
                <i data-lucide="file-text"></i> Manifesto
            </a>
            <a href="#" class="nav-item" onclick="loadMarkdownFile('architecture.md')">
                <i data-lucide="cpu"></i> Seni Bina
            </a>
        </div>

        <div class="nav-group">
            <p class="nav-label">Daily Logs</p>
            <div class="search-box">
                <input type="text" id="day-search" placeholder="Cari Hari (cth: 1)..." oninput="filterDays()">
            </div>
            <div id="days-list" class="days-list"></div>
        </div>

        <div class="sidebar-footer">
            <p>Version 1.0.0</p>
            <p>Zero-Error Philosophy</p>
        </div>
    </nav>

    <main class="main-content">
        <header class="top-bar">
            <div class="breadcrumb">
                <span id="breadcrumb-path">NEO OS / Home</span>
            </div>
            <div class="user-profile">
                <span id="current-date"></span>
            </div>
        </header>

        <div class="content-wrapper">
            <div id="markdown-content" class="markdown-body">
                <div class="loader">Memuatkan Sistem...</div>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
    <script>lucide.createIcons();</script>
</body>
</html>
